name: Build GuessTheSpeedrunner Fabric 1.20.1

on:
  push:
    branches:
      - build/guess-the-speedrunner-1201
    paths:
      - ".github/workflows/build-guessspeedrunner.yml"
      - "guess-the-speedrunner/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source project
        run: |
          base64 -d guess-the-speedrunner/source.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.3.0.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.3.1.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.3.2.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.3.3.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          rm -f guess-the-speedrunner/src/main/java/dev/zunserz/gts/mixin/PlayerEntityMixin.java guess-the-speedrunner/src/main/java/dev/zunserz/gts/mixin/CreativeInventoryScreenMixin.java
          base64 -d guess-the-speedrunner/patch-0.4.0.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          sed -i 's/"OFF"),b->/"OFF")),b->/' guess-the-speedrunner/src/main/java/dev/zunserz/gts/client/VisualGuiEditorScreen.java
          base64 -d guess-the-speedrunner/patch-0.5.0.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.6.0.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.6.0-fixes.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.6.0-final.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          # Older HUD Mixin must be removed: the 1.20.1 target method does not exist.
          rm -f guess-the-speedrunner/src/main/java/dev/zunserz/gts/mixin/ExperienceHudMixin.java
          rm -f guess-the-speedrunner/src/main/java/dev/zunserz/gts/client/LevelTimer.java
          base64 -d guess-the-speedrunner/patch-0.6.1.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          # v0.6.3 is intentionally based on v0.6.1. Do not apply v0.6.2.
          base64 -d guess-the-speedrunner/patch-0.6.3.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.6.3-fix1.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.6.3-extra.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.6.3-glasses.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          base64 -d guess-the-speedrunner/patch-0.6.3-dev-gui.tar.xz.b64 | tar -xJ -C guess-the-speedrunner
          # Build the 0.6.4 hotfix on top of 0.6.3: real XP, Craft, recipe lock and coder trigger wand.
          base64 -d guess-the-speedrunner/patch-0.6.4-git.diff.xz.b64 | xz -d > /tmp/gts-0.6.4.patch
          git apply --check --directory=guess-the-speedrunner /tmp/gts-0.6.4.patch
          git apply --directory=guess-the-speedrunner /tmp/gts-0.6.4.patch
          # Apply v0.6.5 to the reconstructed v0.6.4 sources.
          (cd guess-the-speedrunner && python apply-0.6.5.py)
          grep -q 'mod_version=0.6.5' guess-the-speedrunner/gradle.properties
          ! grep -q 'ExperienceHudMixin' guess-the-speedrunner/src/main/resources/gts.mixins.json
          test -f guess-the-speedrunner/src/main/resources/fabric.mod.json
          test -f guess-the-speedrunner/build.gradle
      - name: Build Fabric mod
        working-directory: guess-the-speedrunner
        run: gradle --no-daemon --stacktrace clean build
      - name: Upload mod and source jars
        uses: actions/upload-artifact@v4
        with:
          name: GuessTheSpeedrunner-Fabric-1.20.1-0.6.5
          path: |
            guess-the-speedrunner/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
